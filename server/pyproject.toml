[project]
name = "defencetest-server"
version = "0.1.0"
license = { text = "GPL-3.0-only" }
description = "defencetest-server"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "awscli>=1.46.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "pymongo>=4.18.1",
    "python-multipart>=0.0.32",
    "regex>=2026.9.10",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "uvicorn>=0.53.0",
    "vtjson>=2.3.0",
    "zxcvbn>=4.5.0",
]

[dependency-groups]
test = [
    "httpx2>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/Owen-Foundation/DefenceTest"
Documentation = "https://github.com/Owen-Foundation/DefenceTest/wiki"
Repository = "https://github.com/Owen-Foundation/DefenceTest"
Issues = "https://github.com/Owen-Foundation/DefenceTest"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["defencetest"]

[tool.ruff]
target-version = "py314"
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]
